<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/layout :: page(~{::section})}">
<section>
    <p>Hi <span th:text="${name}">there</span>,</p>
    <p>Welcome to BookMarked! Please confirm your email address to finish setting up your account.</p>
    <p style="margin:28px 0;">
        <a th:href="${link}"
           style="background:#1e3a8a;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;">
            Verify email
        </a>
    </p>
    <p style="color:#52525b;font-size:13px;">
        This link expires in <span th:text="${hours}">24</span> hours. If the button doesn't work, paste this link into
        your browser:<br><span th:text="${link}" style="word-break:break-all;"></span>
    </p>
</section>
</body>
</html>
