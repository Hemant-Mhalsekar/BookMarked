<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/layout :: page(~{::section})}">
<section>
    <p>Hi <span th:text="${name}">there</span>,</p>
    <p>Your BookMarked account was deleted on <span th:text="${when}">today</span>. Your profile, addresses,
        Your Stack and Bookmarks are gone, and your reviews now show as "Former customer".</p>
    <p>Past orders and invoices are kept, as tax law requires.</p>
    <p>Thanks for reading with us. You're always welcome back with a new account.</p>
</section>
</body>
</html>
