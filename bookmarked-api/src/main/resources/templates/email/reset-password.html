<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/layout :: page(~{::section})}">
<section>
    <p>Hi <span th:text="${name}">there</span>,</p>
    <p>We received a request to reset your BookMarked password.</p>
    <p style="margin:28px 0;">
        <a th:href="${link}"
           style="background:#1e3a8a;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;">
            Reset password
        </a>
    </p>
    <p style="color:#52525b;font-size:13px;">
        This link works once and expires in <span th:text="${minutes}">30</span> minutes.
        If you didn't ask for this, you can ignore this email; your password stays the same.
    </p>
</section>
</body>
</html>
