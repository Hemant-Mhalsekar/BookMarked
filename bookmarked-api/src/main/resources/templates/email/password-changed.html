<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/layout :: page(~{::section})}">
<section>
    <p>Hi <span th:text="${name}">there</span>,</p>
    <p>Your BookMarked password was changed on <strong th:text="${when}">today</strong>.
        For your security, you have been signed out of your other devices.</p>
    <p>If you didn't make this change, <a th:href="${resetLink}">reset your password now</a>.</p>
</section>
</body>
</html>
