<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/layout :: page(~{::section})}">
<section>
    <p>Hi <span th:text="${name}">there</span>,</p>
    <p>You've been added to the BookMarked team as <strong th:text="${role}">Order Manager</strong>.
        Set a password to activate your staff account.</p>
    <p style="margin:28px 0;">
        <a th:href="${link}"
           style="background:#1e3a8a;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;">
            Set your password
        </a>
    </p>
    <p style="color:#52525b;font-size:13px;">
        This link works once and expires in <span th:text="${hours}">48</span> hours.
        If you weren't expecting this, you can ignore the email.
    </p>
</section>
</body>
</html>
