spring:
  application:
    name: bookmarked-api
  config:
    # Local secrets: the .env file in the repo root (when run from bookmarked-api/) or the current folder.
    # Both are optional and git-ignored; real environment variables still win.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookmarked?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:bookmarked}
    password: ${DB_PASSWORD:bookmarked}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Loads authors/categories/variants for a whole page of books in a few queries (no N+1)
        default_batch_fetch_size: 50
  cache:
    type: caffeine
    cache-names: categories
    caffeine:
      spec: maximumSize=200,expireAfterWrite=10m
  servlet:
    multipart:
      # E-book PDFs up to 100 MB (the upload service checks the size again)
      max-file-size: 100MB
      max-request-size: 101MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------------
# BookMarked business + security settings
# ---------------------------------------------------------------
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:BookMarked <no-reply@bookmarked.local>}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    staff-access-ttl: ${JWT_STAFF_ACCESS_TTL:PT10M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    issuer: bookmarked
  cookie:
    name: bm_refresh
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:true}
    same-site: Strict
    path: /api/auth
  security:
    max-failed-logins: 5
    lock-duration: PT15M
    refresh-reuse-grace: PT30S
    email-verification-ttl: PT24H
    password-reset-ttl: PT30M
  seed:
    super-admin-email: ${SUPER_ADMIN_EMAIL:}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:}
    super-admin-phone: ${SUPER_ADMIN_PHONE:}
    super-admin-name: ${SUPER_ADMIN_NAME:Super Admin}
    # Inserts ~16 sample books on an empty database (enabled in the dev profile)
    demo-catalog: ${SEED_DEMO_CATALOG:false}
  storage:
    # local = a private folder (dev, docker-compose); s3 = an S3-compatible bucket (Cloudflare R2 in production)
    type: ${STORAGE_TYPE:local}
    # Private folder for e-book PDFs (never served directly)
    local-dir: ${STORAGE_DIR:./data/files}
    s3:
      endpoint: ${R2_ENDPOINT:}          # https://<account-id>.r2.cloudflarestorage.com
      region: ${R2_REGION:auto}
      bucket: ${R2_BUCKET:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
    # How long a read or download link stays valid
    link-ttl: PT5M
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: https://api.razorpay.com
  business:
    reservation-minutes: 15
    delivery-fee: 40
    free-delivery-threshold: 499
    cod-max-order-value: 5000
    cod-fee: 0
    max-unpaid-cod-orders: 2
    return-window-days: 7
    ebook-download-limit: 5
    low-stock-threshold: 5

---
spring:
  config:
    activate:
      on-profile: dev
app:
  cookie:
    secure: ${COOKIE_SECURE:false}
  seed:
    demo-catalog: ${SEED_DEMO_CATALOG:true}
logging:
  level:
    com.bookmarked: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      # free-tier MySQL plans allow few connections
      maximum-pool-size: ${DB_POOL_SIZE:5}
management:
  health:
    # an SMTP hiccup must not mark the API unhealthy (the host would restart it)
    mail:
      enabled: false
app:
  storage:
    type: ${STORAGE_TYPE:s3}
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
logging:
  level:
    root: INFO
